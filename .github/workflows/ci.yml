name: CI - Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check Syntax & Compilation
      run: |
        python -m compileall app tests seeds wsgi.py run.py config.py

    - name: Run Test Suite (Pytest)
      run: |
        pytest tests/ -v

    - name: Verify Application Boot
      run: |
        python -c "from wsgi import app; print('Successfully initialized:', app.name)"