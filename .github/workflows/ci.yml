name: CI - Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check Python Syntax
      run: |
        python -m py_compile wsgi.py run.py config.py app/database.py app/models.py app/utils.py app/routes/auth.py app/routes/dashboard.py app/routes/internship.py app/routes/profile.py app/routes/ai.py

    - name: Smoke Test Application Boot
      run: |
        python -c "from wsgi import app; print(app.name)"
