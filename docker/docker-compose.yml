version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: teleportal_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=prod
      - SECRET_KEY=teleportal-enterprise-secret-key-2026-prod
      - DATABASE_URL=mysql+pymysql://teleportal:teleportal_secure_pass@db:3306/teleportal_db
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - teleportal_uploads:/app/app/static/uploads
    networks:
      - teleportal_net

  db:
    image: mysql:8.0
    container_name: teleportal_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_teleportal_pass
      MYSQL_DATABASE: teleportal_db
      MYSQL_USER: teleportal
      MYSQL_PASSWORD: teleportal_secure_pass
    ports:
      - "3306:3306"
    volumes:
      - teleportal_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teleportal_net

  redis:
    image: redis:7-alpine
    container_name: teleportal_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - teleportal_redis_data:/data
    networks:
      - teleportal_net

  nginx:
    image: nginx:alpine
    container_name: teleportal_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - teleportal_net

volumes:
  teleportal_db_data:
  teleportal_redis_data:
  teleportal_uploads:

networks:
  teleportal_net:
    driver: bridge