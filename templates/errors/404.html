{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="glass-card p-5">
        <div class="display-1 fw-bold text-primary mb-2">404</div>
        <div class="fs-4 fw-bold text-dark mb-2">Opportunity Not Located</div>
        <p class="text-muted mb-4">The route or resource you are seeking has been relocated, archived, or never existed in the TELEPORTAL registry.</p>
        <div class="d-flex justify-content-center gap-3">
          <a href="{{ url_for('internship.index') }}" class="btn btn-teleportal px-4">
            <i class="bi bi-house-door me-1"></i>Back to Home
          </a>
          <a href="{{ url_for('internship.list_internships') }}" class="btn btn-outline-primary px-4">
            <i class="bi bi-search me-1"></i>Browse Internships
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
