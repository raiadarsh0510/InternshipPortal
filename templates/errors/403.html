{% extends "base.html" %}

{% block title %}Access Restricted (403){% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="glass-card p-5">
        <div class="display-1 fw-bold text-warning mb-2">403</div>
        <div class="fs-4 fw-bold text-dark mb-2">Restricted Clearance</div>
        <p class="text-muted mb-4">You do not possess the role credentials or administrative permissions required to access this resource.</p>
        <div class="d-flex justify-content-center gap-3">
          <a href="{{ url_for('internship.index') }}" class="btn btn-teleportal px-4">
            <i class="bi bi-house-door me-1"></i>Back to Safety
          </a>
          <a href="{{ url_for('auth.login') }}" class="btn btn-outline-primary px-4">
            <i class="bi bi-shield-lock me-1"></i>Switch Account
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
