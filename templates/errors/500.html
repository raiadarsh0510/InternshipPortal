{% extends "base.html" %}

{% block title %}Server Error (500){% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="glass-card p-5">
        <div class="display-1 fw-bold text-danger mb-2">500</div>
        <div class="fs-4 fw-bold text-dark mb-2">Internal Anomaly</div>
        <p class="text-muted mb-4">Our server encountered an unexpected error processing your request. Our automated telemetry has flagged this incident for administrator inspection.</p>
        <div class="d-flex justify-content-center gap-3">
          <a href="{{ url_for('internship.index') }}" class="btn btn-teleportal px-4">
            <i class="bi bi-house-door me-1"></i>Back to Home
          </a>
          <button onclick="window.location.reload()" class="btn btn-outline-secondary px-4">
            <i class="bi bi-arrow-clockwise me-1"></i>Retry Request
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
