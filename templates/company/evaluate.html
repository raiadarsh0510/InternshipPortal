{% extends "base.html" %}
{% block title %}NEP 2020 Academic Evaluation{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="glass-panel p-4 p-md-5">
        <h3 class="fw-bold text-primary mb-1"><i class="bi bi-award me-2"></i>NEP 2020 Academic Evaluation</h3>
        <p class="text-muted small mb-4">Complete candidate performance sign-off for university credit accreditation.</p>

        <form method="POST" action="{{ url_for('company.evaluate_academic', application_id=application.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Intern Name</label>
            <input type="text" class="form-control bg-light" value="{{ application.applicant.name }}" readonly>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label small fw-semibold">College Name</label>
              <input type="text" name="college_name" class="form-control" value="{{ application.applicant.student_profile.college if application.applicant.student_profile else '' }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Attendance (%)</label>
              <input type="number" step="0.5" name="attendance" class="form-control" value="96" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Technical Skill (1-5)</label>
              <input type="number" name="technical_competence" class="form-control" min="1" max="5" value="5" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Professionalism (1-5)</label>
              <input type="number" name="professionalism" class="form-control" min="1" max="5" value="5" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Project Delivery (1-5)</label>
              <input type="number" name="project_completion" class="form-control" min="1" max="5" value="5" required>
            </div>
            <div class="col-12">
              <label class="form-label small fw-semibold">Supervisor Feedback & Remarks</label>
              <textarea name="remarks" class="form-control" rows="3" required>Exceptional engineering performance and team collaboration.</textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-success px-4 py-2">Submit Official NEP Evaluation</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
